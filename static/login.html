<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T3 Watchdock – Sign in</title>
<script>
try { const t = localStorage.getItem("theme"), s = localStorage.getItem("style");
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  if (s === "terminal" || s === "turbo" || s === "focus") document.documentElement.dataset.style = s; } catch (e) {}
</script>
<link rel="stylesheet" href="style.css">
<style>
  body.login-page { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 16px; box-sizing: border-box; background: var(--bg); }
  .login-card { width: 100%; max-width: 380px; box-sizing: border-box; padding: 28px; box-shadow: 0 8px 30px rgb(0 0 0 / .08); }
  .login-head { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .login-logo { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--acc); color: var(--acc-fg); flex: none; }
  .login-logo svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .login-head h1 { font-size: 20px; line-height: 1.2; }
  .login-head p { margin: 2px 0 0; color: var(--mut); font-size: 14px; }
  .login-card .field { margin-bottom: 14px; }
  .login-card input { box-sizing: border-box; }
  .login-card .btn { width: 100%; justify-content: center; margin-top: 6px; padding: 10px 14px; }
  .login-msg { display: none; margin: 0 0 14px; padding: 10px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4;
    color: var(--err); border: 1px solid var(--err); background: color-mix(in srgb, var(--err) 8%, transparent); }
  .login-msg.show { display: block; }
</style>
</head>
<body class="login-page">
<main class="card login-card">
  <div class="login-head">
    <div class="login-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <div><h1>T3 Watchdock</h1><p>Sign in to continue</p></div>
  </div>
  <form id="f" novalidate>
    <p class="login-msg" id="msg" role="alert"></p>
    <div class="field"><label for="name">Name</label>
      <input id="name" name="name" autocomplete="username" required autofocus></div>
    <div class="field"><label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit" id="go">Sign in</button>
  </form>
</main>
<script>
const f = document.getElementById("f"), msg = document.getElementById("msg"), go = document.getElementById("go");
const show = t => { msg.textContent = t; msg.classList.toggle("show", !!t); };
f.onsubmit = async ev => {
  ev.preventDefault();
  if (!f.name.value.trim() || !f.password.value) return show("Enter name and password.");
  show(""); go.disabled = true; go.textContent = "Signing in…";
  try {
    const r = await fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({name: f.name.value.trim(), password: f.password.value})});
    if (r.ok) return location.replace("/");
    show((await r.json()).error || `Error ${r.status}`);
  } catch (e) { show(e.message); }
  go.disabled = false; go.textContent = "Sign in";
  f.password.value = ""; f.password.focus();
};
</script>
</body>
</html>
